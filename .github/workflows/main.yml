name: STM32 Firmware Build Automation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # ૧. કોડ અને સબમોડ્યુલ્સ (cJSON) ક્લાઉડમાં લાવવા
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    # ૨. ARM Toolchain ઇન્સ્ટોલ કરવું
    - name: Install ARM Toolchain
      uses: carlosperate/arm-none-eabi-gcc-action@v1
      with:
        release: '10.3-2021.10'

    # ૩. કોડ કમ્પાઇલ કરવો
    - name: Build Firmware
      shell: bash
      run: |
        set -euxo pipefail
        mkdir -p build_out
        
        MCU_FLAGS="-mcpu=cortex-m3 -mthumb"
        DEFINES="-DSTM32F103xB -DUSE_HAL_DRIVER"
        
        # પ્રોજેક્ટના બધા જ ઇન્ક્લુડ ફોલ્ડર્સ આપમેળે શોધવા (cJSON નું ટેસ્ટ ફોલ્ડર ઇગ્નૉર કર્યું છે)
        INC_DIRS=$(find . -type d -not -path './.git*' -not -path './build_out*' -not -path './Middlewares/cJSON/tests*')
        INCLUDES=""
        while IFS= read -r dir; do
          [ -n "$dir" ] && INCLUDES="$INCLUDES -I$dir"
        done <<< "$INC_DIRS"
        
        CFLAGS="$MCU_FLAGS $DEFINES $INCLUDES -O0 -g3 -Wall -ffunction-sections -fdata-sections"
        ASFLAGS="$MCU_FLAGS -x assembler-with-cpp -c"
        
        # બધી જ એસેમ્બલી (.s) ફાઇલો કમ્પાઇલ કરવી
        mapfile -t ASM_SOURCES < <(find . -name '*.s' -not -path './.git/*' -not -path './build_out/*')
        for asm_file in "${ASM_SOURCES[@]}"; do
          safe_asm_name=$(echo "$asm_file" | sed 's/[\/.]/_/g')
          arm-none-eabi-gcc $ASFLAGS "$asm_file" -o "build_out/${safe_asm_name}.o"
        done
        
        # બધી જ સોર્સ (.c) ફાઇલો કમ્પાઇલ કરવી (cJSON ના ટેસ્ટ અને ફઝિંગ ફોલ્ડર્સ ઇગ્નૉર કર્યા છે)
        mapfile -t SOURCES < <(
          find . -name '*.c' \
            -not -path './.git/*' \
            -not -path './build_out/*' \
            -not -path './Middlewares/cJSON/tests/*' \
            -not -path './Middlewares/cJSON/fuzzing/*'
        )
        for file in "${SOURCES[@]}"; do
          safe_obj_name=$(echo "$file" | sed 's/[\/.]/_/g')
          arm-none-eabi-gcc $CFLAGS -c "$file" -o "build_out/${safe_obj_name}.o"
        done
        
        # લિંકિંગ પ્રોસેસ (બધી જ ઓબ્જેક્ટ ફાઇલો ભેગી કરવી)
        LINKER_SCRIPT=$(find . -name '*.ld' -not -path './.git/*' | head -n 1)
        arm-none-eabi-gcc $MCU_FLAGS -T"$LINKER_SCRIPT" build_out/*.o -o build_out/firmware.elf -Wl,--gc-sections --specs=nano.specs -lm
        
        # HEX અને BIN બાયનરી જનરેશન
        arm-none-eabi-objcopy -O ihex build_out/firmware.elf build_out/firmware.hex
        arm-none-eabi-objcopy -O binary build_out/firmware.elf build_out/firmware.bin

    # ૪. ફાઇનલ ફાઇલો ગિટહબ પર અપલોડ કરવી
    - name: Upload Output Firmware
      uses: actions/upload-artifact@v4
      with:
        name: STM32F103-Firmware
        path: |
          build_out/firmware.hex
          build_out/firmware.bin
